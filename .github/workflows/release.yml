# Publica uma release nova do app a cada push no main que mexa no app desktop.
# A versão é automática: <Major>.<Minor> do Directory.Build.props + o próximo número livre.
#   Ex.: Version 1.0.0 e a última release v1.0.4  ->  v1.0.5
#   Para pular para 1.1.x ou 2.0.x, mude <Version> no Directory.Build.props.
# O site baixa sempre o anexo da última release:
#   https://github.com/Raidoxxx/probable-app/releases/latest/download/Ximbuismo-Setup.exe
# Também dá para rodar à mão: Actions › Release › Run workflow.
name: Release

on:
  push:
    branches: [main]
    paths:
      - apps/desktop/**
      - packages/shared/**
      - Directory.Build.props
      - scripts/build-installer.ps1
      - scripts/build-signed-release.ps1
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false   # uma release por vez, na ordem dos pushes

env:
  SERVER_URL: https://probable-app.discloud.dev

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Testar regressões de segurança antes da release
        shell: pwsh
        run: |
          dotnet build tests/SecurityRegression/SecurityRegression.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Compilação dos testes falhou.' }
          $dotnet = (Get-Command dotnet).Source
          & $dotnet tests/SecurityRegression/bin/Release/net10.0-windows/SecurityRegression.dll $dotnet apps/server/bin/Release/net10.0/PCBoost.Server.dll
          if ($LASTEXITCODE -ne 0) { throw 'Regressões de segurança falharam.' }

      - name: Calcular a versão
        id: version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [xml]$props = Get-Content Directory.Build.props
          $base = [version](($props.Project.PropertyGroup | Where-Object { $_.Version } | Select-Object -First 1).Version)
          $prefix = "v$($base.Major).$($base.Minor)."
          $tags = gh release list --repo $env:GITHUB_REPOSITORY --limit 200 --json tagName --jq '.[].tagName'
          $patches = @($tags | Where-Object { $_ -like "$prefix*" } | ForEach-Object { [int]($_.Substring($prefix.Length)) })
          $next = if ($patches.Count) { ($patches | Measure-Object -Maximum).Maximum + 1 } else { [math]::Max($base.Build, 0) }
          $version = "$($base.Major).$($base.Minor).$next"
          "version=$version" >> $env:GITHUB_OUTPUT
          "Versão da release: $version"

      - name: Gerar o instalador
        shell: pwsh
        env:
          UPDATE_CERTIFICATE_PFX: ${{ secrets.UPDATE_CERTIFICATE_PFX }}
          UPDATE_CERTIFICATE_PASSWORD: ${{ secrets.UPDATE_CERTIFICATE_PASSWORD }}
          UPDATE_MANIFEST_PRIVATE_KEY: ${{ secrets.UPDATE_MANIFEST_PRIVATE_KEY }}
        run: ./scripts/build-signed-release.ps1 -ServerUrl $env:SERVER_URL -Version ${{ steps.version.outputs.version }} -Repository $env:GITHUB_REPOSITORY

      - name: Conferir o instalador
        shell: pwsh
        run: |
          $exe = Get-Item installer/Ximbuismo-Setup.exe
          $info = [Diagnostics.FileVersionInfo]::GetVersionInfo($exe.FullName)
          "{0:N1} MB, versão {1}" -f ($exe.Length / 1MB), $info.ProductVersion
          if (-not $info.ProductVersion.StartsWith("${{ steps.version.outputs.version }}")) { throw "Versão errada no executável." }

      - name: Publicar a release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v${{ steps.version.outputs.version }}"
          gh release create $tag installer/Ximbuismo-Setup.exe installer/update-manifest.json installer/update-manifest.sig --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA `
            --title "Ximbuismo ${{ steps.version.outputs.version }}" --generate-notes --latest
          if ($LASTEXITCODE -ne 0) { throw "gh release create falhou." }
